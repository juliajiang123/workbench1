name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "standalone.html"
      - "main.js"
      - "package.json"
      - "builder.json"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Windows portable EXE
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-standalone-win
          path: dist/*.exe
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-exe-${{ github.run_number }}
          name: Windows EXE v${{ github.run_number }}
          files: dist/*.exe
